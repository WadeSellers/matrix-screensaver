name: MatrixSaver
options:
  bundleIdPrefix: com.wadesellers
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  defaultConfig: Release
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Wade's Apple Developer Program team. Xcode auto-fetches the
    # right Apple Development / Apple Distribution certificate based
    # on whether we're building locally or for upload.
    DEVELOPMENT_TEAM: GV76VP4G8V
    CLANG_ENABLE_MODULES: YES

targets:
  MatrixCore:
    type: framework
    platform: macOS
    sources:
      - path: MatrixCore
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.MatrixCore
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
    info:
      path: MatrixCore/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"

  SaverTest:
    type: application
    platform: macOS
    sources:
      - path: SaverTest
    dependencies:
      - target: MatrixCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.SaverTest
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
    info:
      path: SaverTest/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication

  # Target name stays "MatrixApp" (and folder stays MatrixApp/) for
  # internal consistency with the Swift class names — only the
  # *user-facing* identity rebrands to "Falling Code". Bundle ID
  # stays "cipherfall" (the second-rebrand legacy) because Apple
  # binds App Store Connect records permanently to the Bundle ID.
  MatrixApp:
    type: application
    platform: macOS
    sources:
      - path: MatrixApp
    # Force xcodegen to generate a shared scheme for this target.
    # Without an explicit `scheme:` block, xcodegen will skip scheme
    # generation if Xcode user-data has previously suppressed
    # autocreation — which happens whenever the user modifies the
    # scheme via Xcode UI (e.g. attaching Configuration.storekit).
    scheme: {}
    dependencies:
      - target: MatrixCore
        embed: true
    settings:
      base:
        # Bundle ID is permanent (Apple binds App Store records to it),
        # so it stays "cipherfall" even though the user-facing name is
        # now "Falling Code". Bundle ID is internal — never shown.
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.cipherfall
        PRODUCT_NAME: Falling Code
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        # App icon comes from Assets.xcassets/AppIcon.appiconset. The
        # asset-catalog compiler emits the runtime .icns and sets
        # CFBundleIconName for App Store submission validators.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        # App Sandbox — required for Mac App Store distribution.
        # See MatrixApp/FallingCode.entitlements for the entitlement set.
        CODE_SIGN_ENTITLEMENTS: MatrixApp/FallingCode.entitlements
    info:
      path: MatrixApp/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # Menu-bar app — no Dock icon, no main menu bar item except via
        # NSStatusItem.
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Wade Sellers"
        # URL scheme: fallingcode://activate, fallingcode://dismiss,
        # fallingcode://toggle. Use to wire up Shortcuts.app, Raycast,
        # Alfred, Stream Deck, Hammerspoon, AppleScript — anything that
        # can open a URL.
        CFBundleURLTypes:
          - CFBundleURLName: com.wadesellers.cipherfall
            CFBundleURLSchemes:
              - fallingcode

  MatrixSaver:
    type: bundle
    platform: macOS
    sources:
      - path: MatrixSaver
    dependencies:
      - target: MatrixCore
        embed: true
        codeSign: true
      - sdk: ScreenSaver.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wadesellers.MatrixSaver
        PRODUCT_NAME: MatrixSaver
        WRAPPER_EXTENSION: saver
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"
        SKIP_INSTALL: NO
        ENABLE_HARDENED_RUNTIME: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: MatrixSaver/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: BNDL
        NSPrincipalClass: MatrixSaverView
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
